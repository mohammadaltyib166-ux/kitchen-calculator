<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة سعر مطبخ ألمنيوم</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
.container{max-width:760px;margin:30px auto;padding:16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #00000012}
h1{margin-top:0;font-size:26px}.sub{color:#666;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:bold;font-size:14px;display:block;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{border:1px solid #ddd;border-radius:10px;padding:12px;background:#fafafa}
.check input{width:auto}.result{margin-top:20px;background:#f0f7ff;border-radius:14px;padding:18px}
.price{font-size:32px;font-weight:bold;margin:6px 0}.muted{color:#666;font-size:13px}
button{border:0;border-radius:11px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:14px}
.calc{background:#222;color:#fff;width:100%}.wa{background:#20b15a;color:#fff;width:100%}
.note{font-size:12px;color:#777;margin-top:12px}
@media(max-width:600px){.grid,.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>حاسبة سعر مطبخ ألمنيوم</h1>
<div class="sub">نسخة أولية — أدخل المقاسات والخيارات لمعرفة السعر التقديري.</div>

<div class="grid">
<div><label>نوع المطبخ</label>
<select id="shape"><option value="1">مستقيم</option><option value="1.15">حرف L</option><option value="1.3">حرف U</option></select></div>

<div><label>الطول الإجمالي (متر)</label><input id="length" type="number" min="0" step="0.1" value="4"></div>

<div><label>ارتفاع الخزائن (متر)</label><input id="height" type="number" min="0" step="0.01" value="0.7"></div>

<div><label>سعر المتر الأساسي (د.ل)</label><input id="meter" type="number" min="0" step="1" value="850"></div>

<div><label>عدد الأدراج</label><input id="drawers" type="number" min="0" step="1" value="4"></div>

<div><label>سعر الدرج (د.ل)</label><input id="drawerPrice" type="number" min="0" step="1" value="75"></div>

<div class="full"><label>الإضافات</label>
<div class="checks">
<label class="check"><input id="wall" type="checkbox"> خزائن معلقة (+300 د.ل)</label>
<label class="check"><input id="access" type="checkbox"> إكسسوارات (+250 د.ل)</label>
<label class="check"><input id="counter" type="checkbox"> سطح/رخام (+400 د.ل)</label>
<label class="check"><input id="delivery" type="checkbox"> توصيل وتركيب (+200 د.ل)</label>
</div></div>
</div>

<button class="calc" onclick="calculate()">احسب السعر</button>

<div class="result">
<div class="muted">السعر التقديري</div>
<div class="price" id="total">0 د.ل</div>
<div id="details" class="muted"></div>
</div>

<button class="wa" onclick="sendWhatsApp()">إرسال الطلب عبر واتساب</button>
<div class="note">ملاحظة: السعر النهائي تقديري ويُحدد بعد مراجعة المقاسات والخامات والمعاينة.</div>
</div>
</div>

<script>
let lastTotal=0;
function n(id){return Number(document.getElementById(id).value)||0}
function calculate(){
 const shape=n('shape'), length=n('length'), meter=n('meter'), drawers=n('drawers'), drawerPrice=n('drawerPrice');
 let base=length*meter*shape, drawer=drawers*drawerPrice, extras=0;
 if(document.getElementById('wall').checked) extras+=300;
 if(document.getElementById('access').checked) extras+=250;
 if(document.getElementById('counter').checked) extras+=400;
 if(document.getElementById('delivery').checked) extras+=200;
 lastTotal=base+drawer+extras;
 document.getElementById('total').textContent=lastTotal.toLocaleString('ar-LY')+' د.ل';
 document.getElementById('details').textContent=`أساسي: ${base.toLocaleString('ar-LY')} د.ل + أدراج: ${drawer.toLocaleString('ar-LY')} د.ل + إضافات: ${extras.toLocaleString('ar-LY')} د.ل`;
}
function sendWhatsApp(){
 calculate();
 const text=`السلام عليكم، أريد الاستفسار عن مطبخ ألمنيوم.%0Aالطول: ${n('length')} م%0Aالارتفاع: ${n('height')} م%0Aعدد الأدراج: ${n('drawers')}%0Aالسعر التقديري: ${lastTotal.toLocaleString('ar-LY')} د.ل`;
 const phone=''; 
 if(!phone){alert('ضع رقم واتساب المصنع داخل الكود في متغير phone قبل النشر.');return;}
 location.href='https://wa.me/'+phone+'?text='+text;
}
calculate();
</script>
</body>
</html>
